<div class="notification-container">

  <h3>Notifications</h3>

  <button type="button" (click)="addNotification()">
    Add Notification
  </button>

  <button type="button" (click)="clearNotifications()">
    Clear Notifications
  </button>

  @if (notificationService.getMessages().length === 0) {

    <p>No notifications.</p>

  } @else {

    @for (
      message of notificationService.getMessages();
      track $index
    ) {

      <p>{{ message }}</p>

    }

  }

</div>
